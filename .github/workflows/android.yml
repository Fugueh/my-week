# 构建安卓 APK。
# - 推送 v 开头的标签（例如 v0.1.0）：构建签名版并发布到 GitHub Releases
# - 在 Actions 页面手动运行：构建一次，APK 在这次运行的 Artifacts 里下载
# 签名需要在仓库 Settings → Secrets and variables → Actions 里设置四个 secret：
#   ANDROID_KEYSTORE_BASE64  密钥文件 base64 后的内容
#   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
# 没设置的话（比如别人 fork 了这个仓库），会构建一个调试签名的 APK，也能装，只是不能和正式版互相覆盖。
name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 检查版本号：标签、package.json、web/js/version.js 三处一致
        if: github.ref_type == 'tag'
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "::error::标签 $GITHUB_REF_NAME 和 package.json 的 $V 不一致"; exit 1; }
          grep -q "APP_VERSION = \"$V\"" web/js/version.js || { echo "::error::web/js/version.js 里的 APP_VERSION 不是 $V"; exit 1; }

      - name: 安装依赖，把 web/ 拷进安卓工程
        run: |
          npm ci
          npm test
          npx cap sync android
          chmod +x android/gradlew

      - name: 准备签名密钥
        id: sign
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.sign.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.{0}-dev', github.run_number) }}
        run: |
          # 版本号 = 运行序号 + 100：本机自己出的测试包用 1–99，永远比 CI 的正式包小，装了测试包也能被正式包覆盖更新（安卓不允许版本号变小）
          export VERSION_CODE=$((RUN_NUMBER + 100))
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../my-week.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../my-week-debug.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "*.apk"

      - name: 发布到 Releases
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          generate_release_notes: true
